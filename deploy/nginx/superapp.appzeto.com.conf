# master super-app (food + taxi + service-provider) -> 127.0.0.1:5007
#
# Modelled on k9-api.conf, which fronts the LIVE pre-integration build on 5005.
# This is a separate server block, separate domain, separate upstream; it does not
# touch that one.
#
# client_max_body_size is 50M rather than k9-api.conf's 25M because the
# service-provider module accepts larger uploads (its standalone server used a
# 50mb body limit).
#
# Installed to /etc/nginx/sites-available/ and symlinked into sites-enabled.
#
# TLS lives in this file, not only on the server. It used to rely on Certbot
# appending the ssl listener and the redirect on first issue, so the repo copy
# was HTTP-only and a fresh box -- or a redeploy of this file -- silently served
# the API over plain HTTP.
#
# First issue on a new box (the 443 block needs the certificate to exist before
# `nginx -t` will pass):
#   1. comment out the 443 server block, reload nginx
#   2. mkdir -p /var/www/certbot
#      certbot certonly --webroot -w /var/www/certbot -d superapp.appzeto.com
#   3. uncomment the 443 block, `nginx -t && systemctl reload nginx`
# Renewal is certbot's systemd timer; the webroot location below keeps it working.

server {
    listen 80;
    listen [::]:80;
    server_name superapp.appzeto.com;

    # ACME http-01 challenges for renewal. Everything else goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` rather than `http2 on;`: the latter needs nginx 1.25.1+,
    # and this box's distro nginx may be older. Newer nginx only warns about it.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name superapp.appzeto.com;

    ssl_certificate     /etc/letsencrypt/live/superapp.appzeto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/superapp.appzeto.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 50M;

    # Socket.IO. Master uses the default namespace, service-provider uses /sp;
    # both ride the same /socket.io/ path, so one location covers them.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5007/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5007/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded media, served straight off disk. This used to proxy to Node, which
    # has no static mount for the directory -- every uploaded image 404'd even
    # though the file was written fine. Static files belong to nginx anyway; the
    # other apps on this box (quick-commerce) do exactly this.
    #
    # The root must match UPLOAD_STORAGE_ROOT in the app's .env: the storage
    # service resolves to /var/www/uploads in production.
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location /health {
        proxy_pass http://127.0.0.1:5007/health;
        proxy_set_header Host $host;
    }
}
